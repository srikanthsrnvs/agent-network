[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anet"
version = "0.3.1"
description = "agent-network from Python: the four verbs and a long-polling inbox against a relay, plus OpenAI Agents SDK tools"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
agents = ["openai-agents>=0.20"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/srikanthsrnvs/agent-network"

[tool.setuptools]
packages = ["anet"]

[tool.setuptools.package-data]
anet = ["SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
